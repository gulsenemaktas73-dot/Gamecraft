<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Minecraft Supreme Edition</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #87CEEB; touch-action: none; }
        canvas { display: block; }
        #ui { position: absolute; top: 10px; left: 10px; color: white; font-family: Arial; pointer-events: none; }
    </style>
</head>
<body>
    <div id="ui">PC: WASD + Mouse | Mobil: Ekran Solu (Yürü), Sağ (Koy)</div>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // --- TEMEL KURULUM ---
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer();
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // --- DEĞİŞKENLER ---
        let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
        let canJump = true;
        let velocity = new THREE.Vector3();
        const gravity = -0.01;
        let breakTimer;

        // --- IŞIK VE ZEMİN ---
        const light = new THREE.HemisphereLight(0xeeeeff, 0x777788, 1);
        scene.add(light);
        const grid = new THREE.GridHelper(100, 100);
        scene.add(grid);
        camera.position.y = 1.6;

        // --- ⌨️ BİLGİSAYAR KONTROLLERİ ---
        window.addEventListener('keydown', (e) => {
            switch (e.code) {
                case 'KeyW': moveForward = true; break;
                case 'KeyS': moveBackward = true; break;
                case 'KeyA': moveLeft = true; break;
                case 'KeyD': moveRight = true; break;
                case 'Space': if(canJump) { velocity.y = 0.2; canJump = false; } break;
            }
        });
        window.addEventListener('keyup', (e) => {
            switch (e.code) {
                case 'KeyW': moveForward = false; break;
                case 'KeyS': moveBackward = false; break;
                case 'KeyA': moveLeft = false; break;
                case 'KeyD': moveRight = false; break;
            }
        });

        // --- 🖱️ MOUSE (KIRMA / KOYMA) ---
        window.addEventListener('mousedown', (e) => {
            if (e.button === 0) { // Sol Tık: Kır
                breakTimer = setInterval(() => { console.log("Blok Kırılıyor..."); }, 200);
            } else if (e.button === 2) { // Sağ Tık: Koy
                console.log("Blok Konuldu!");
            }
        });
        window.addEventListener('mouseup', () => clearInterval(breakTimer));
        window.addEventListener('contextmenu', e => e.preventDefault());

        // --- 📱 TELEFON KONTROLLERİ ---
        let touchStartX = 0, touchStartY = 0;
        window.addEventListener('touchstart', (e) => {
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
            if (touchStartX > window.innerWidth / 2) console.log("Mobil: Blok Koyuldu!");
        });
        window.addEventListener('touchmove', (e) => {
            let tX = e.touches[0].clientX, tY = e.touches[0].clientY;
            if (touchStartX < window.innerWidth / 2) {
                moveForward = (tY < touchStartY - 20);
                moveBackward = (tY > touchStartY + 20);
                moveLeft = (tX < touchStartX - 20);
                moveRight = (tX > touchStartX + 20);
            }
        });
        window.addEventListener('touchend', () => {
            moveForward = moveBackward = moveLeft = moveRight = false;
        });

        // --- OYUN DÖNGÜSÜ ---
        function animate() {
            requestAnimationFrame(animate);
            
            // Yerçekimi ve Hareket
            velocity.y += gravity;
            camera.position.y += velocity.y;
            if (camera.position.y <= 1.6) {
                camera.position.y = 1.6;
                velocity.y = 0;
                canJump = true;
            }

            if (moveForward) camera.translateZ(-0.1);
            if (moveBackward) camera.translateZ(0.1);
            if (moveLeft) camera.translateX(-0.1);
            if (moveRight) camera.translateX(0.1);

            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
