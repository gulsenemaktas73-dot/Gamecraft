<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Minecraft Supreme - PC & MOBILE HYBRID</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Segoe UI', sans-serif; touch-action: none; user-select: none; background: #000; }
        canvas { display: block; }

        /* --- HUD --- */
        #crosshair { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #fff; font-size: 24px; pointer-events: none; z-index: 5; text-shadow: 1px 1px #000; }
        #hud { position: absolute; bottom: 100px; left: 50%; transform: translateX(-50%); width: 320px; pointer-events: none; z-index: 10; }
        .stat { color: #fff; text-shadow: 2px 2px #000; font-size: 18px; font-weight: bold; }

        /* --- MOBİL KONTROLLER (PC'DE DE GÖRÜNÜR AMA KLAVYE ÇALIŞIR) --- */
        .ctrl { position: absolute; background: rgba(0,0,0,0.4); border: 2px solid #fff; border-radius: 50%; color: #fff; display: flex; justify-content: center; align-items: center; font-weight: bold; z-index: 30; }
        #joy-area { bottom: 30px; left: 30px; width: 110px; height: 110px; }
        #joy-stick { position: absolute; width: 45px; height: 45px; background: #fff; border-radius: 50%; opacity: 0.7; pointer-events: none; }
        #btn-jump { bottom: 130px; right: 30px; width: 75px; height: 75px; }
        #btn-inv { bottom: 40px; right: 30px; width: 75px; height: 75px; background: #2980b9; }

        /* --- HOTBAR --- */
        #hotbar-wrap { position: absolute; bottom: 15px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.85); border: 3px solid #333; padding: 4px; z-index: 20; display: flex; border-radius: 4px; }
        .slot { width: 42px; height: 42px; border: 3px solid #8b8b8b; margin: 2px; display: flex; justify-content: center; align-items: center; font-size: 24px; background: #8b8b8b; cursor: pointer; }
        .slot.active { border-color: #fff; transform: scale(1.1); background: #aaa; box-shadow: 0 0 15px #fff; }

        /* --- ENVANTER --- */
        #inv-modal { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 90%; height: 80%; background: #c6c6c6; border: 6px solid #333; display: none; z-index: 500; flex-direction: row; }
        #inv-sidebar { width: 70px; background: #8b8b8b; border-right: 4px solid #333; display: flex; flex-direction: column; }
        .inv-tab { flex: 1; display: flex; justify-content: center; align-items: center; font-size: 28px; cursor: pointer; border-bottom: 2px solid #333; }
        #inv-content { flex: 1; display: grid; grid-template-columns: repeat(auto-fill, minmax(50px, 1fr)); gap: 8px; padding: 15px; overflow-y: auto; }
        .inv-item { aspect-ratio: 1; background: #8b8b8b; border: 3px solid #333; display: flex; justify-content: center; align-items: center; font-size: 26px; cursor: pointer; }

        /* --- CHAT --- */
        #chat-wrap { position: absolute; top: 10px; left: 10px; z-index: 100; width: 280px; pointer-events: none; }
        #chat-log { height: 100px; background: rgba(0,0,0,0.3); color: white; overflow: hidden; padding: 5px; font-size: 13px; }
        #chat-input { width: 100%; background: rgba(0,0,0,0.8); border: 1px solid #fff; color: #fff; display: none; padding: 8px; pointer-events: auto; }
    </style>
</head>
<body>

<div id="crosshair">+</div>
<div id="chat-wrap"><div id="chat-log"></div><input type="text" id="chat-input"></div>

<div id="hud">
    <div class="stat" id="dim-text">BOYUT: DÜNYA</div>
</div>

<div id="joy-area" class="ctrl"><div id="joy-stick"></div></div>
<div id="btn-jump" class="ctrl">ZIPLA</div>
<div id="btn-inv" class="ctrl">E</div>

<div id="hotbar-wrap"></div>

<div id="inv-modal">
    <div id="inv-sidebar">
        <div class="inv-tab" onclick="loadCat('nature')">🌿</div>
        <div class="inv-tab" onclick="loadCat('war')">⚔️</div>
        <div class="inv-tab" onclick="loadCat('blocks')">🧱</div>
        <div class="inv-tab" onclick="loadCat('mobs')">🥚</div>
    </div>
    <div id="inv-content"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
    // --- 1. SAHNE VE BOYUT SİSTEMİ ---
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: false });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    scene.add(new THREE.AmbientLight(0xffffff, 0.8));
    const player = new THREE.Group();
    player.position.set(0, 15, 0);
    scene.add(player);
    player.add(camera);
    camera.position.y = 1.6;

    let currentDim = 0;
    const dims = [{n:"DÜNYA", c:0x87CEEB}, {n:"NETHER", c:0x330000}, {n:"END", c:0x050505}];
    scene.background = new THREE.Color(dims[0].c);

    // --- 2. KLAVYE VE MOUSE KONTROLLERİ (YENİ) ---
    const keys = {};
    window.addEventListener('keydown', e => { 
        keys[e.code] = true; 
        // Sayı tuşları ile hotbar değişimi
        if(e.key >= 1 && e.key <= 9) { curS = e.key - 1; updateHB(); }
        // E tuşu envanter
        if(e.code === 'KeyE') toggleInv();
        // T tuşu chat
        if(e.code === 'KeyT') { chatIn.style.display="block"; chatIn.focus(); }
    });
    window.addEventListener('keyup', e => { keys[e.code] = false; });

    // Fare ile Bakış (Pointer Lock)
    renderer.domElement.addEventListener('click', () => {
        if(document.pointerLockElement !== renderer.domElement) renderer.domElement.requestPointerLock();
    });

    window.addEventListener('mousemove', e => {
        if(document.pointerLockElement === renderer.domElement) {
            player.rotation.y -= e.movementX * 0.002;
            camera.rotation.x -= e.movementY * 0.002;
            camera.rotation.x = Math.max(-Math.PI/2, Math.min(Math.PI/2, camera.rotation.x));
        }
    });

    // --- 3. BLOKLAR VE DÜNYA ---
    let blockMap = new Map();
    const boxGeo = new THREE.BoxGeometry(1, 1, 1);
    const mats = {'🌿':0x2ecc71,'🧱':0x95a5a6,'⬛':0x111111,'🌀':0x8A2BE2,'🔴':0xb22222,'🟡':0xffd700,'default':0xbdc3c7};

    function getK(x,y,z) { return `${Math.round(x)},${Math.round(y)},${Math.round(z)}`; }

    function createB(x,y,z,t) {
        const k = getK(x,y,z); if(blockMap.has(k)) return;
        const m = new THREE.Mesh(boxGeo, new THREE.MeshLambertMaterial({color: mats[t]||mats['default']}));
        m.add(new THREE.LineSegments(new THREE.EdgesGeometry(boxGeo), new THREE.LineBasicMaterial({color:0, linewidth:2})));
        m.position.set(Math.round(x), Math.round(y), Math.round(z));
        m.userData = {type: t};
        scene.add(m); blockMap.set(k, m);
    }

    // Başlangıç Alanı
    for(let x=-10; x<10; x++) for(let z=-10; z<10; z++) createB(x, 0, z, '🌿');

    // --- 4. ETKİLEŞİM ---
    let bTimer;
    const ray = new THREE.Raycaster();
    const hbItems = ['⛏️','🗡️','🧱','⬛','🧨','🌿','💎','🥚','🍎'];
    let curS = 0;

    window.addEventListener('pointerdown', e => {
        if(e.target.tagName !== 'CANVAS') return;
        ray.setFromCamera({x:0, y:0}, camera);
        const hits = ray.intersectObjects(Array.from(blockMap.values()));
        if(hits.length > 0 && hits[0].distance < 6) {
            bTimer = setTimeout(() => { // KIR
                scene.remove(hits[0].object);
                blockMap.delete(getK(hits[0].object.position.x, hits[0].object.position.y, hits[0].object.position.z));
            }, 400);
        }
    });

    window.addEventListener('pointerup', e => {
        if(bTimer) {
            clearTimeout(bTimer);
            ray.setFromCamera({x:0, y:0}, camera);
            const hits = ray.intersectObjects(Array.from(blockMap.values()));
            if(hits.length > 0 && hits[0].distance < 6) {
                const target = hits[0].object;
                const p = target.position.clone().add(hits[0].face.normal);
                const item = hbItems[curS];
                
                if(item === '🧨' && target.userData.type === '⬛') createB(target.position.x, target.position.y+1, target.position.z, '🌀');
                else if(['🧱','⬛','🌿','💎','🔴','🟡'].includes(item)) createB(p.x, p.y, p.z, item);
                else if(item === '🥚') spawnMob(p.x, p.y, p.z);
            }
        }
        bTimer = null;
    });

    function spawnMob(x,y,z) {
        const m = new THREE.Mesh(new THREE.BoxGeometry(0.6,1.8,0.6), new THREE.MeshLambertMaterial({color:0xffb6c1}));
        m.position.set(x, y+1, z);
        m.userData = {vx:0.02, vz:0.02};
        scene.add(m); entities.push(m);
    }
    const entities = [];

    // --- 5. FİZİK VE OYUN DÖNGÜSÜ ---
    let vY = 0, isG = false;
    function animate() {
        // Yerçekimi
        let fy = Math.floor(player.position.y - 1.6);
        let px = Math.round(player.position.x), pz = Math.round(player.position.z);
        
        // Portal Kontrol
        let standBlock = blockMap.get(getK(px, fy, pz));
        if(standBlock && standBlock.userData.type === '🌀') {
            currentDim = (currentDim + 1) % 3;
            document.getElementById('dim-text').innerText = "BOYUT: " + dims[currentDim].n;
            scene.background = new THREE.Color(dims[currentDim].c);
            player.position.y = 15;
        }

        if(vY <= 0 && blockMap.has(getK(px, fy, pz))) {
            vY = 0; isG = true; player.position.y = fy + 1 + 1.6;
        } else { vY -= 0.015; isG = false; }
        player.position.y += vY;

        // PC ve Mobil Hareket Birleştirme
        const d = new THREE.Vector3(0,0,-1).applyQuaternion(player.quaternion);
        const s = new THREE.Vector3(1,0,0).applyQuaternion(player.quaternion);
        let moveF = (keys['KeyW']?1:0) - (keys['KeyS']?1:0) + joyM.f;
        let moveR = (keys['KeyD']?1:0) - (keys['KeyA']?1:0) + joyM.r;
        let speed = (keys['ShiftLeft'] || isC)? 0.05 : 0.12;

        if(keys['Space'] && isG) vY = 0.25;

        player.position.addScaledVector(d, moveF * speed);
        player.position.addScaledVector(s, moveR * speed);

        entities.forEach(m => { m.position.x += m.userData.vx; m.position.z += m.userData.vz; if(Math.random()<0.02){m.userData.vx=(Math.random()-0.5)*0.05; m.userData.vz=(Math.random()-0.5)*0.05;}});

        renderer.render(scene, camera);
        requestAnimationFrame(animate);
    }

    // Mobil Joystick (Hala çalışıyor)
    let joyM = {f:0, r:0}, isC = false;
    const ja = document.getElementById('joy-area'), js = document.getElementById('joy-stick');
    ja.ontouchmove = e => {
        let r = ja.getBoundingClientRect(), t = e.touches[0];
        let dx = t.clientX-(r.left+55), dy = t.clientY-(r.top+55);
        let d = Math.min(Math.sqrt(dx*dx+dy*dy), 45);
        let a = Math.atan2(dy, dx);
        js.style.transform = `translate(${Math.cos(a)*d}px, ${Math.sin(a)*d}px)`;
        joyM.f = -Math.sin(a)*(d/45); joyM.r = Math.cos(a)*(d/45);
    };
    ja.ontouchend = () => { js.style.transform="translate(0,0)"; joyM={f:0,r:0}; };
    document.getElementById('btn-jump').onclick = () => { if(isG) vY = 0.25; };

    // Envanter ve HB
    function updateHB() { document.getElementById('hotbar-wrap').innerHTML = hbItems.map((it, i) => `<div class="slot ${i===curS?'active':''}" onclick="curS=${i};updateHB()">${it}</div>`).join(''); }
    function toggleInv() { let m = document.getElementById('inv-modal'); m.style.display = m.style.display==="none"?"flex":"none"; if(m.style.display==="flex") loadCat('nature'); }
    document.getElementById('btn-inv').onclick = toggleInv;

    function loadCat(c) {
        const items = {nature:['🌿','🪵','🍎'], war:['🗡️','🧨','⛏️'], blocks:['🧱','⬛','💎','🔴','🟡'], mobs:['🥚']};
        document.getElementById('inv-content').innerHTML = items[c].map(it => `<div class="inv-item" onclick="hbItems[curS]='${it}';updateHB();toggleInv()">${it}</div>`).join('');
    }

    const chatIn = document.getElementById('chat-input');
    chatIn.onkeydown = e => { if(e.key==='Enter') { document.getElementById('chat-log').innerHTML += `<div>> ${chatIn.value}</div>`; chatIn.value=""; chatIn.style.display="none"; }};

    updateHB();
    animate();
</script>
</body>
</html>
